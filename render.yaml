services:
  - type: web
    name: ai-attendance-app
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    preDeployCommand: python db_init.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-attendance-db
          property: connectionString

databases:
  - name: ai-attendance-db
    plan: free
